<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11765c"><meta name="description" content="온라인 장기 홈 화면 설치"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon-192.png"><title>온라인 장기 · 홈 화면 바로가기</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#102e4d;background:#f4f8ff}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 8% 4%,#e1f7ff,transparent 50%),linear-gradient(#f8fbff,#eef6ff)}main{width:min(500px,100%);background:#fff;border:1px solid #dce8f3;border-radius:24px;box-shadow:0 22px 65px #1231631a;padding:clamp(16px,5vw,25px)}.logo{display:block;width:92px;height:92px;border-radius:22px;margin:0 auto 14px}h1{font-size:clamp(24px,6vw,32px);text-align:center;margin:0 0 8px}p{line-height:1.65;color:#48647e;font-size:15px;margin:8px 0 16px}.sub{text-align:center}.actions{display:flex;flex-direction:column;gap:9px;margin:18px 0}.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #126e74;border-radius:999px;padding:10px 14px;font:800 16px system-ui;text-decoration:none;cursor:pointer;color:white;background:linear-gradient(120deg,#146edf,#008c80)}.btn.alt{border:1px solid #9db8cc;background:#edf7ff;color:#135479}.btn:disabled{opacity:.6;cursor:default}.note{background:#f6f9fd;border:1px solid #dce6ef;border-radius:14px;padding:12px;font-size:13px;color:#4d647a;line-height:1.65}details{margin:12px 0;color:#33536d;font-size:14px;line-height:1.7}summary{cursor:pointer;font-weight:700}.foot{text-align:center;font-size:12px;margin:14px 0 0;color:#61778c}[hidden]{display:none!important}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #c99b27;outline-offset:3px}
</style></head><body><main><img class="logo" src="./icons/icon-192.png" alt="장기 게임 아이콘"><h1>온라인 장기</h1><p class="sub">무료 게임을 홈 화면에서 빠르게 실행하세요.</p><div class="actions" id="actions"><a id="play" class="btn" href="./launch.html">🎮 바로 게임 시작</a><button class="btn alt" id="install" type="button">📲 홈 화면 아이콘 설치</button></div><div class="note" id="status" role="status" aria-live="polite">이미 설치하셨다면 홈 화면의 장기 아이콘을 이용하세요. 설치 여부는 브라우저에 따라 확인할 수 없습니다.</div><details id="guide"><summary>설치 및 재설치 방법</summary><p id="deviceGuide"></p><p>설치 메뉴가 없으면 이미 설치했거나 브라우저에서 설치를 지원하지 않을 수 있습니다. 일반 Chrome 또는 Safari에서 다시 확인하세요.</p></details><p class="foot">이용자 확인 없이 자동 설치되지 않습니다. 아이콘은 기존 Blogger 게임을 엽니다.</p></main><script>
(()=>{'use strict';const btn=document.getElementById('install'),play=document.getElementById('play'),actions=document.getElementById('actions'),status=document.getElementById('status'),guide=document.getElementById('guide');let deferred=null,confirmed=false;const ua=navigator.userAgent||'';const ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);document.getElementById('deviceGuide').textContent=ios?'Safari: 공유 버튼 → 홈 화면에 추가 → 추가.':/Android/i.test(ua)?'Android Chrome: 오른쪽 위 ⋮ → 앱 설치 또는 홈 화면에 추가.':'Chrome/Edge: 주소창의 설치 아이콘 또는 브라우저 메뉴 → 앱 설치.';
function setConfirmed(){confirmed=true;deferred=null;btn.hidden=true;play.classList.remove('alt');actions.prepend(play);status.textContent='설치가 확인되었습니다. 홈 화면의 장기 아이콘으로 실행하거나 바로 게임을 시작하세요.';}
if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true)setConfirmed();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();if(confirmed)return;deferred=e;btn.hidden=false;btn.classList.remove('alt');play.classList.add('alt');actions.prepend(btn);status.textContent='설치 준비 완료: 아이콘 설치를 누르면 확인창이 열립니다.';});
window.addEventListener('appinstalled',setConfirmed);
// Best effort only: an empty result or missing API is NOT proof of non-installation.
if(typeof navigator.getInstalledRelatedApps==='function')navigator.getInstalledRelatedApps().then(apps=>{if(apps.some(a=>a.platform==='webapp'&&(a.id===location.origin+'/bitevoyage-janggi/'||a.id==='/bitevoyage-janggi/')))setConfirmed();}).catch(()=>{});
btn.addEventListener('click',async()=>{if(confirmed)return;if(!deferred){status.textContent='이미 설치했거나 이 브라우저에서 자동 설치를 지원하지 않을 수 있습니다. 게임은 바로 시작할 수 있습니다.';guide.open=true;return;}const evt=deferred;deferred=null;try{await evt.prompt();const result=await evt.userChoice;if(!confirmed)status.textContent=result.outcome==='accepted'?'설치 요청을 수락했습니다. 홈 화면에서 아이콘을 확인하세요.':'설치를 취소했습니다. 필요할 때 다시 시도하세요.';}catch(e){status.textContent='설치 확인창을 열지 못했습니다. 아래 방법을 이용하세요.';guide.open=true;}if(!confirmed){btn.classList.add('alt');play.classList.remove('alt');actions.prepend(play);}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));})();
</script></body></html>
